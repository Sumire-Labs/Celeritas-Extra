name: Releases

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6.1.0
        name: Set up Gradle
      - name: Add permission
        run: chmod +x ./gradlew
      - name: Execute Gradle build
        run: ./gradlew clean build verifyReleaseJar

      - name: Select release artifacts
        shell: bash
        run: |
          mkdir -p build/release
          for artifact in build/libs/*.jar; do
            case "$artifact" in
              *-dev.jar|*-shadow.jar) continue ;;
            esac
            cp "$artifact" build/release/
          done

      - uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "build/release/*.jar"
          generateReleaseNotes: true
