name: Releases

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6.1.0
        name: Set up Gradle
      - name: Execute Gradle build
        run: ./gradlew clean build verifyReleaseJar

      - name: Select release artifacts
        shell: bash
        run: |
          mkdir -p build/release
          for artifact in build/libs/*.jar; do
            case "$artifact" in
              *-dev.jar|*-mcp.jar|*-shadow.jar) continue ;;
            esac
            cp "$artifact" build/release/
          done

      - name: Extract release notes from changelog
        shell: bash
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" tag "]") == 1) { found = 1; next }
            }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > build/release-notes.md
          test -s build/release-notes.md

      - uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "build/release/*.jar"
          bodyFile: build/release-notes.md
