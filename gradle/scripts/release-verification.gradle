import groovy.json.JsonSlurper
import java.util.zip.ZipFile

// Validate the remapped artifact, not just classes on the development classpath.
tasks.register('verifyReleaseJar') {
    dependsOn(tasks.named('reobfJar'))
    def releaseFile = tasks.named('reobfJar').flatMap { it.output }
    inputs.file(releaseFile)
    doLast {
        new ZipFile(releaseFile.get().asFile).withCloseable { zip ->
            def readText = { String path ->
                def entry = zip.getEntry(path)
                if (entry == null) throw new GradleException("Release artifact is missing ${path}")
                zip.getInputStream(entry).withCloseable { it.getText('UTF-8') }
            }
            def metadata = new JsonSlurper().parseText(readText('mcmod.info'))[0]
            if (metadata.version != project.version.toString() || metadata.modid != mod_id) {
                throw new GradleException('Release version or mod ID does not match project metadata')
            }
            def pack = new JsonSlurper().parseText(readText('pack.mcmeta')).pack
            if (pack.pack_format != 3 || pack.description != "${mod_name} Resources".toString()) {
                throw new GradleException('Resource pack metadata contains unresolved or incorrect tokens')
            }
            // Check the compiled constants and inlined annotation too: replacing only mcmod.info
            // would still leave an invalid mod ID/version in Forge's Java entry point.
            def readClass = { String path ->
                def entry = zip.getEntry(path)
                if (entry == null) throw new GradleException("Release artifact is missing ${path}")
                zip.getInputStream(entry).withCloseable { input ->
                    java.lang.classfile.ClassFile.of().parse(input.readAllBytes())
                }
            }
            def packagePath = "${root_package}.${mod_id}".replace('.', '/')
            def reference = readClass("${packagePath}/Reference.class")
            [MOD_ID: mod_id, MOD_NAME: mod_name, VERSION: project.version.toString()].each { name, expected ->
                def field = reference.fields().find { it.fieldName().stringValue() == name }
                def constant = field?.findAttribute(java.lang.classfile.Attributes.constantValue())?.orElse(null)
                if (constant?.constant()?.constantValue() != expected) {
                    throw new GradleException("Unresolved or incorrect build constant: Reference.${name}")
                }
            }
            def mod = readClass("${packagePath}/CeleritasExtraMod.class")
            def annotations = mod.findAttribute(java.lang.classfile.Attributes.runtimeVisibleAnnotations()).orElse(null)
            def annotation = annotations?.annotations()?.find {
                it.className().stringValue() == 'Lnet/minecraftforge/fml/common/Mod;'
            }
            def values = annotation?.elements()?.findAll { it.name().stringValue() in ['modid', 'name', 'version'] }
                    ?.collectEntries { [(it.name().stringValue()): it.value().stringValue()] }
            if (values?.modid != mod_id || values?.version != project.version.toString() || values?.name != mod_name) {
                throw new GradleException('TokenEnvoy constants were not inlined into the @Mod annotation')
            }
            def dependencies = annotation.elements().find { it.name().stringValue() == 'dependencies' }?.value()?.stringValue()
            if (!dependencies?.contains('required-after:cleanroom@[0.7.11-alpha,0.8)')) {
                throw new GradleException('Release annotation must require the supported Cleanroom 0.7.x API')
            }
            if (['celeritas', 'actinium', 'nothirium', 'renderlib'].any { metadata.dependencies.contains(it) }) {
                throw new GradleException('Release metadata must allow either supported renderer')
            }
            def config = new JsonSlurper().parseText(readText("${mod_id}.mixin.json"))
            if (!config.refmap) throw new GradleException('Release Mixin config has no refmap')
            def refmap = new JsonSlurper().parseText(readText(config.refmap))
            if (!refmap.mappings) throw new GradleException('Release Mixin refmap is empty')
            // These hooks combine optional renderer targets and MixinExtras.
            // A nonempty refmap alone would not catch a silently lost remapper.
            [
                'animation/MixinTextureAtlasSprite': ['updateAnimation()V'],
                'background_fps/MixinMinecraft': ['getLimitFramerate'],
                'options_search/MixinOptionsScreen': ['initGui', 'drawScreen', 'mouseClicked'],
                'render/entity/MixinRenderItemFrame': ['renderItem(Lnet/minecraft/entity/item/EntityItemFrame;)V'],
                'profiler/MixinRenderManager': ['renderEntity'],
                'profiler/MixinTileEntityRendererDispatcher': ['render(Lnet/minecraft/tileentity/TileEntity;DDDFIF)V'],
                'render/block_entity/MixinTileEntitySignRenderer': ['render(Lnet/minecraft/tileentity/TileEntitySign;DDDFIF)V'],
                'particle/MixinParticleManager': ['spawnEffectParticle'],
                'item_cache/MixinRenderItemVertexCache': ['renderModel(Lnet/minecraft/client/renderer/block/model/IBakedModel;ILnet/minecraft/item/ItemStack;)V', 'renderQuads']
            ].each { mixin, selectors ->
                selectors.each { selector ->
                    def mapped = refmap.mappings["com/sumirelabs/celeritasextra/mixin/${mixin}"]?.get(selector)
                    if (!(mapped instanceof String) || !mapped.contains(';func_')) {
                        throw new GradleException("Missing production selector mapping: ${mixin} ${selector}")
                    }
                }
            }
            def requireEntry = { String name ->
                if (zip.getEntry(name) == null) throw new GradleException("Release artifact is missing ${name}")
            }
            requireEntry('META-INF/LICENSE.md')
            config.client.each { name -> requireEntry((config.package + '.' + name).replace('.', '/') + '.class') }
            requireEntry(config.plugin.replace('.', '/') + '.class')
            ['en_us', 'ja_jp', 'ru_ru', 'zh_cn'].each { locale ->
                readText("assets/${mod_id}/lang/${locale}.lang")
            }
            requireEntry('META-INF/MANIFEST.MF')
            def manifest = zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')).withCloseable { new java.util.jar.Manifest(it) }
            if (manifest.mainAttributes.getValue('MixinConfigs') != "${mod_id}.mixin.json") {
                throw new GradleException('Release manifest does not register the Mixin config')
            }
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    def bytecode = zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                    if (new String(bytecode, java.nio.charset.StandardCharsets.ISO_8859_1).contains('org/lwjgl/glfw/')) {
                        throw new GradleException("Removed GLFW backend referenced by ${entry.name}")
                    }
                }
                if (entry.name.endsWith('.class') && entry.name ==~ /(?:net\/minecraft\/|net\/minecraftforge\/|org\/taumc\/|org\/embeddedt\/|dhj\/embeddedt\/|com\/dhj\/|meldexun\/|net\/irisshaders\/|net\/coderbot\/).*/) {
                    throw new GradleException("Renderer or game dependency bundled in release: ${entry.name}")
                }
            }
        }
        logger.lifecycle("Verified release artifact: ${releaseFile.get().asFile.name}")
    }
}
tasks.named('build') { dependsOn(tasks.named('verifyReleaseJar')) }
