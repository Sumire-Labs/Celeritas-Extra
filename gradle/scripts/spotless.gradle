if (spotlessEnabled) {
    apply plugin: 'com.diffplug.spotless'
    spotless {
        encoding 'UTF-8'
        lineEndings = 'UNIX'
        java {
            target 'src/*/java/**/*.java'
            toggleOffOn()
            importOrderFile('spotless.importorder')
            removeUnusedImports()
            // The Spotless release pins its recommended Eclipse formatter version.
            eclipse().configFile('spotless.eclipseformat.xml')
            trimTrailingWhitespace()
            endWithNewline()
        }
        format 'misc', {
            target '*.gradle', '*.properties', '.gitignore', '.gitattributes',
                    'gradle/scripts/*.gradle', '.github/workflows/*.yml'
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}
