def remotePublishing = publish_to_maven.toBoolean()
def localPublishing = publish_to_local_maven.toBoolean()
if (remotePublishing || localPublishing) {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                // Development artifact is MCP-named; runtime artifact is SRG-named.
                from components.java
                groupId = root_package
                artifactId = mod_id
                artifact(tasks.reobfJar) { classifier = 'srg' }
                pom {
                    name = mod_name
                    description = mod_description
                    if (!mod_url.isBlank()) url = mod_url
                    licenses {
                        license {
                            name = 'GNU Lesser General Public License v3.0'
                            url = 'https://www.gnu.org/licenses/lgpl-3.0.html'
                            distribution = 'repo'
                        }
                    }
                }
            }
        }
        if (remotePublishing && !localPublishing) {
            if (maven_url.isBlank()) throw new GradleException('Set maven_url before enabling publish_to_maven.')
            repositories {
                maven {
                    name = maven_name
                    url = maven_url
                    credentials {
                        username = providers.environmentVariable('MAVEN_USERNAME')
                                .orElse(providers.gradleProperty("${maven_name}Username")).orNull
                        password = providers.environmentVariable('MAVEN_PASSWORD')
                                .orElse(providers.gradleProperty("${maven_name}Password")).orNull
                    }
                }
            }
        }
    }
}

// The same runtime artifact is used for CurseForge and Modrinth.
apply plugin: 'me.modmuss50.mod-publish-plugin'
// Use the public DSL constants: applied scripts cannot import the optional plugin's classes.
def publisher = extensions.getByName('publishMods')
def releaseTypes = [ALPHA: publisher.ALPHA, BETA: publisher.BETA, RC: publisher.BETA, RELEASE: publisher.STABLE]
publishMods {
    file = tasks.named('reobfJar').flatMap { it.output }
    version = project.version.toString()
    displayName = "${mod_name} ${project.version}"
    type = versioning.stage.map { stage ->
        releaseTypes[stage.name()]
    }
    modLoaders.add('forge')
    maxRetries = 5
    def notes = providers.environmentVariable('CHANGELOG_FILE').orElse('RELEASE_NOTES.md')
    changelog = providers.fileContents(layout.projectDirectory.file(notes)).asText.orElse('')
    if (!curseforge_project_id.isBlank()) {
        curseforge {
            projectId = curseforge_project_id
            accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
            minecraftVersions.add('1.12.2')
            client = true
            server = false
        }
    }
    if (!modrinth_project_id.isBlank()) {
        modrinth {
            projectId = modrinth_project_id
            accessToken = providers.environmentVariable('MODRINTH_TOKEN')
            minecraftVersions.add('1.12.2')
        }
    }
}
