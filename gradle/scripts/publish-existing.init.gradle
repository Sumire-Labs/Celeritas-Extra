// Used only by the manual existing-release publisher. Upload the already-published GitHub
// artifact instead of rebuilding a tag with later publishing configuration changes.
allprojects {
    afterEvaluate {
        def artifact = System.getenv('RELEASE_ARTIFACT')
        if (artifact == null || !new File(artifact).isFile()) {
            throw new GradleException('RELEASE_ARTIFACT must name an existing release jar.')
        }
        def publisher = extensions.findByName('publishMods')
        if (publisher == null) throw new GradleException('This release does not configure publishMods.')
        publisher.file.set(new File(artifact))
        // Older release tags have the applied-script ReleaseType classpath bug as well.
        def releaseTypes = [ALPHA: publisher.ALPHA, BETA: publisher.BETA, RC: publisher.BETA, RELEASE: publisher.STABLE]
        publisher.type.set(versioning.stage.map { stage ->
            releaseTypes[stage.name()]
        })
    }
}
