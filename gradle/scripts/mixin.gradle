// Refmap generation and processor versions are provided by CleanroomGradle.
// The extra mapping output also preserves @Shadow/@Overwrite member renaming.
if (mixinEnabled) {
    if (providers.gradleProperty('cg.userdev.refmap').get().isBlank()) {
        throw new GradleException('Set cg.userdev.refmap when enable_mixin=true.')
    }
    def extraMappings = layout.buildDirectory.file('generated/mixin-mappings/mixin.tsrg')
    def mergedMappings = layout.buildDirectory.file('generated/mixin-mappings/merged.tsrg')
    def extractedMapping = tasks.named('extractUserdevMcpToSrg')
    compileJava {
        outputs.file(extraMappings)
        options.compilerArgs += "-AoutTsrgFile=${extraMappings.get().asFile}"
        doFirst { extraMappings.get().asFile.parentFile.mkdirs() }
    }
    def mergeMappings = tasks.register('mergeMixinMappings') {
        group = 'build setup'
        description = 'Merges Minecraft and Mixin member mappings for the reobfuscated jar.'
        dependsOn compileJava, extractedMapping
        inputs.file(extractedMapping.flatMap { it.output })
        inputs.file(extraMappings)
        outputs.file(mergedMappings)
        doLast {
            def base = net.minecraftforge.srgutils.IMappingFile.load(extractedMapping.get().output.get().asFile)
            def extra = net.minecraftforge.srgutils.IMappingFile.load(extraMappings.get().asFile)
            base.merge(extra).write(mergedMappings.get().asFile.toPath(),
                    net.minecraftforge.srgutils.IMappingFile.Format.TSRG2, false)
        }
    }
    reobfJar {
        dependsOn mergeMappings
        map.setFrom(mergedMappings)
    }
} else {
    // The global native-refmap option is set for the enabled build. Suppress it for this variant.
    compileJava.options.compilerArgumentProviders.removeAll {
        it instanceof com.cleanroommc.gradle.env.UserDevTasks.RefmapArguments
    }
    configurations.annotationProcessor.withDependencies { dependencies ->
        dependencies.removeIf {
            it.group == 'com.cleanroommc' && it.name in ['cleanmix', 'mixinextras-common']
        }
    }
    // Also exclude stale generated files when switching variants without a clean checkout.
    def nativeRefmap = providers.gradleProperty('cg.userdev.refmap').get()
    tasks.withType(Jar).configureEach { exclude '*.refmap.json', nativeRefmap }
}
