import groovy.json.JsonOutput
import org.jetbrains.gradle.ext.Gradle

// Build scaffolding adapted from Sumire-Labs/ModTemplate ea1bfde.
// Blue Oak Model License 1.0.0: https://blueoakcouncil.org/license/1.0.0

plugins {
    id 'com.cleanroommc.versioning' version '3.4.0'
    id 'java-library'
    id 'maven-publish'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.cleanroommc.tokenenvoy' version '3.0.0'
    id 'com.gradleup.shadow' version '9.6.1' apply false
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
}

group = root_package
base.archivesName = mod_id
ext.mixinEnabled = enable_mixin.toBoolean()
ext.shadowEnabled = enable_shadow.toBoolean()
ext.atEnabled = use_access_transformer.toBoolean()
ext.coremodEnabled = is_coremod.toBoolean()
ext.modPackage = root_package
ext.devAccessTransformer = layout.buildDirectory.file("generated/access-transformers/${mod_id}_at.cfg")

if (shadowEnabled) apply plugin: 'com.gradleup.shadow'

if (!(mod_id ==~ /[a-z][a-z0-9_-]*/)) {
    throw new GradleException('mod_id must start with a lowercase letter and contain only lowercase letters, numbers, underscores or hyphens.')
}
if (coremodEnabled && coremod_plugin_class_name.isBlank()) {
    throw new GradleException('Set coremod_plugin_class_name before enabling is_coremod.')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    if (generate_sources_jar.toBoolean()) withSourcesJar()
    if (generate_javadocs_jar.toBoolean()) withJavadocJar()
}
configurations {
    contain
    implementation.extendsFrom(contain)
    if (shadowEnabled) {
        shade
        implementation.extendsFrom(shade)
    }
}
dependencies {
    // Cleanroom Mod development uses USERDEV, not the LOADER development mode.
    implementation cleanroom.userdev(cleanroom_version) {
        if (atEnabled) accessTransformers.from(files(devAccessTransformer).builtBy('prepareAccessTransformer'))
    }
    if (mixinEnabled) {
        // Loader runtime dependencies are not necessarily exposed on the API compile classpath.
        compileOnly("com.cleanroommc:cleanmix:${cleanmix_version}") { transitive = false }
        compileOnly("com.cleanroommc:mixinextras-common:${mixinextras_version}") { transitive = false }
        // CleanroomGradle selects annotation processors from the loader's dependency graph.
    }
    if (use_asset_mover.toBoolean()) implementation "com.cleanroommc:assetmover:${asset_mover_version}"
    if (enable_junit_testing.toBoolean()) {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}
sourceSets.main {
    if (mixinEnabled) java.srcDir 'src/mixin/java'
    if (coremodEnabled) java.srcDir 'src/coremod/java'
    if (!atEnabled) resources.exclude 'META-INF/*_at.cfg'
    if (!mixinEnabled) resources.exclude '*.mixin.json'
}

// Java constants are replaced before inlining. Escape JSON values independently.
tokenEnvoy {
    main {
        set 'MOD_ID', mod_id
        set 'MOD_NAME', mod_name
        set 'MOD_VERSION', project.version.toString()
        set 'MOD_PACKAGE', modPackage
        set 'MIXIN_REFMAP', providers.gradleProperty('cg.userdev.refmap')
        set 'MOD_ID_JSON', JsonOutput.toJson(mod_id)
        set 'MOD_NAME_JSON', JsonOutput.toJson(mod_name)
        set 'MOD_VERSION_JSON', JsonOutput.toJson(project.version.toString())
        set 'MOD_DESCRIPTION_JSON', JsonOutput.toJson(mod_description)
        set 'MOD_AUTHORS_JSON', JsonOutput.toJson(mod_authors.split(',').collect { it.trim() }.findAll { it })
        set 'MOD_CREDITS_JSON', JsonOutput.toJson(mod_credits)
        set 'MOD_URL_JSON', JsonOutput.toJson(mod_url)
        set 'MOD_UPDATE_URL_JSON', JsonOutput.toJson(mod_update_json)
        set 'MOD_LOGO_PATH_JSON', JsonOutput.toJson(mod_logo_path)
        set 'MOD_ISSUE_TRACKER_JSON', JsonOutput.toJson(mod_issue_tracker)
        set 'PACK_DESCRIPTION_JSON', JsonOutput.toJson("${mod_name} Resources".toString())
        classes { include '**/Reference.class' }
        resources { include 'mcmod.info', 'pack.mcmeta', '*.mixin.json' }
    }
}
processResources {
    filteringCharset = 'UTF-8'
    rename 'modid.mixin.json', "${mod_id}.mixin.json"
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.matching { it.name in ['jar', 'sourcesJar', 'shadowJar'] }.configureEach {
    from(files('LICENSE.md')) { into 'META-INF' }
}
test {
    useJUnitPlatform()
    if (show_testing_output.toBoolean()) testLogging.showStandardStreams = true
}

apply from: 'gradle/scripts/dependencies.gradle'
apply from: 'gradle/scripts/actinium.gradle'
apply from: 'gradle/scripts/access-transformers.gradle'
apply from: 'gradle/scripts/mixin.gradle'
apply from: 'gradle/scripts/runs.gradle'

idea {
    module { inheritOutputDirs = true; downloadSources = true }
    project.settings.runConfigurations {
        '1. Build'(Gradle) { taskNames = ['build'] }
        '2. Run Client'(Gradle) { taskNames = ['runClient'] }
        '3. Run Server'(Gradle) { taskNames = ['runServer'] }
    }
    if (atEnabled) project.settings.taskTriggers.beforeSync tasks.named('prepareAccessTransformer')
}

jar {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    from(configurations.contain) { into '/' }
    manifest {
        attributes 'ModType': 'CRL'
        if (mixinEnabled) attributes 'MixinConfigs': "${mod_id}.mixin.json"
        if (atEnabled) attributes 'FMLAT': "${mod_id}_at.cfg"
        if (coremodEnabled) {
            attributes 'FMLCorePlugin': coremod_plugin_class_name,
                    'FMLCorePluginContainsFMLMod': coremod_includes_mod
        }
    }
    doFirst {
        if (!configurations.contain.empty) {
            manifest.attributes 'ContainedDeps': configurations.contain.files.collect { it.name }.join(' '),
                    'NonModDeps': 'true'
        }
    }
}
if (shadowEnabled) {
    shadowJar {
        dependsOn tasks.jar
        configurations = [project.configurations.shade]
        archiveClassifier = 'shadow-mcp'
        from(project.configurations.contain) { into '/' }
        // Shadow already inherits the jar manifest; inheriting it again can create a cycle.
    }
    reobfJar {
        from(tasks.shadowJar)
        archiveClassifier.set('')
    }
}
reobfJar { legacyAccessTransformers.set(atEnabled) }
apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/release-verification.gradle'
apply from: 'gradle/scripts/extra.gradle'

// Upload sites use alpha/beta/release; RC builds are published in their beta channel.
tasks.register('printReleaseType') {
    def releaseType = versioning.stage.map { stage ->
        def name = stage.name().toLowerCase(Locale.ROOT)
        name == 'rc' ? 'beta' : name
    }
    inputs.property('releaseType', releaseType)
    doLast { println inputs.properties.releaseType }
}

// Resource-pack tests use Minecraft's resource manager and optional renderer APIs.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}
