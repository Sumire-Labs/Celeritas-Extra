org.gradle.jvmargs = -Xmx3G
org.gradle.caching = true
org.gradle.parallel = true
org.gradle.configuration-cache = true
org.gradle.configuration-cache.parallel = true

# Testing and Formatting
enable_junit_testing = true
show_testing_output = false
# See gradle\spotless
enable_spotless = true

# Compiling
generate_sources_jar = true
generate_javadocs_jar = false

# Shadow
enable_shadow = false

# Cleanroom
cleanroom_version = 0.7.14-alpha

# Information
root_package = com.sumirelabs.celeritasextra
mod_id = celeritasextra
mod_name = Celeritas Extra

# Metadata
mod_description = An unofficial client-side add-on for Celeritas or Nothirium.
mod_logo_path = assets/celeritasextra/icon.png
mod_authors = Sumire Labs, s12kuma01
mod_credits = FlashyReese, dima_dencep
mod_url = https://github.com/Sumire-Labs/Celeritas-Extra
mod_issue_tracker = https://github.com/Sumire-Labs/Celeritas-Extra/issues
mod_update_json =

# License
license = LGPL-3.0-only
# Separate copyright holders with commas.
license_author = Pepelys, Sumire Labs
license_year = 2026

# Mixin
enable_mixin = true
cg.userdev.refmap = celeritasextra.refmap.json

# Coremods
# Uses <root_package>.core.LoadingPlugin.
enable_coremod = false
# Set this to false if the jar has no @Mod class.
coremod_includes_mod = true
# If you move the plugin class, set coremod_plugin_class to its full name.

# Access Transformers
# Uses src/main/resources/META-INF/<mod_id>_at.cfg.
# Use SRG names for fields and methods, e.g. field_130070_K.
# For other filenames, set access_transformers to a space-separated list.
use_access_transformer = false

# AssetMover
# CurseForge doesn't have 3.x
use_asset_mover = true
asset_mover_version = 2.5

# Run Configurations
minecraft_username = Developer
# Separate JVM arguments with spaces. Arguments containing spaces aren't supported.
extra_jvm_args =
enable_mixin_debug = false
enable_foundation_debug = false

# CF/MR publishing
# Set CURSEFORGE_TOKEN and MODRINTH_TOKEN in Action Secrets.
curseforge_project_id = 1451214
modrinth_project_id = LXQekDcE

# Maven Publishing
publish_to_maven = false
publish_to_local_maven = false
# Set MAVEN_USERNAME and MAVEN_PASSWORD　in Action Secrets.
maven_name =
maven_url =

# Versioning
# Tag your releases to set the Mod version. Run ./gradlew -q printVersion to check it.
# Don't add a separate version or mod_version property.
versioning.releaseBranch = main
# Include alpha/beta/rc in the version. Stable tags use e.g. 0.10.3-release.
versioning.stageInVersion = true
