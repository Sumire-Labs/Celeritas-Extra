# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Shadow
enable_shadow = false

# Versions come from Git tags through Cleanroom Versioning (no manual mod_version).
versioning.releaseBranch = main

# Mod Information
root_package = com.sumirelabs
mod_id = celeritasextra
mod_name = Celeritas Extra

# Mod Metadata (Optional)
mod_description = An unofficial client-side add-on for Celeritas, Actinium or Nothirium.
mod_url = https://github.com/Sumire-Labs/Celeritas-Extra
mod_update_json =
# Delimit authors with commas
mod_authors = Sumire Labs, s12kuma01
mod_credits = FlashyReese, dima_dencep
mod_logo_path = assets/celeritasextra/icon.png
mod_issue_tracker = https://github.com/Sumire-Labs/Celeritas-Extra/issues

# Run Configurations
# If multiple arguments/tweak classes are stated, use spaces as the delimiter
minecraft_username = Developer
extra_jvm_args =
enable_foundation_debug = false

# Maven Publishing (credentials use <maven_name>Username / <maven_name>Password)
publish_to_maven = false
# Good for debugging artifacts before uploading to remote maven
# GitHub actions won't run if this is true, test this by running the task `publishToMavenLocal`
publish_to_local_maven = false
maven_name = SumireMaven
maven_url =

# If any properties changes below this line, refresh gradle again to ensure everything is working correctly.
# ----------------------------------------------------------------------------------------------------------------------

# Access Transformers
# A way to change visibility of Minecraft's classes, methods and fields.
# AT files belong in src/main/resources/META-INF/<mod_id>_at.cfg.
# Use MCP names; prepareAccessTransformer generates SRG rules for CleanroomGradle USERDEV.
use_access_transformer = false

# Coremods
# The most powerful way to change Java classes at runtime; only enable this when an IFMLLoadingPlugin is required.
# Set `coremod_includes_mod` to false if the CoreMod does not also contain an @Mod class.
# When enabling this, `coremod_plugin_class_name` must name an IFMLLoadingPlugin implementation.
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover
# Convenient way to allow downloading of assets from official vanilla Minecraft servers, CurseForge, or any direct links
# Documentation: https://github.com/CleanroomMC/AssetMover
use_asset_mover = true
asset_mover_version = 2.5

# Cleanroom 0.7.x USERDEV; LWJGLY comes from the loader dependency graph.
cleanroom_version = 0.7.11-alpha
cleanmix_version = 0.7.4
mixinextras_version = 0.5.5
enable_mixin = true
cg.userdev.refmap = celeritasextra.refmap.json
enable_mixin_debug = false
org.gradle.caching = true
